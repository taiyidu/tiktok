spring:
  application:
    name: gongsheng
  profiles:
    # 默认激活 dev（本地），线上通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  tomcat:
    threads: # 限制最大爬虫数量防止服务器的内存扛不住
      max: 10

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启自动驼峰转换：下划线 <=> 驼峰
    map-underscore-to-camel-case: true

ILoveApi:
  apikey: ${TPSApiKey}
  appid: ${appid}
  apiBaseUrl: https://qyapi.ipaybuy.cn/api/video

gongsheng:
  jwt:
    admin-secret-key: taiyidu-gongsheng-jwt-secret-key-2026
    admin-ttl: 604800000
    admin-token-name: Authorization
