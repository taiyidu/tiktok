spring:
  application:
    name: gongsheng
  profiles:
    # 默认激活 dev（本地），线上通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
#  datasource:
#    url: jdbc:mysql://localhost:3306/gongsheng?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
#    username: root
#    password: 200710
#    driver-class-name: com.mysql.cj.jdbc.Driver
# 服务器配置jdbc:mysql://mysql8:3306/gongsheng?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
# 本地配置jdbc:mysql://localhost:3306/gongsheng?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
server:
  tomcat:
    threads: # 限制最大爬虫数量防止服务器的内存扛不住
      max: 3

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启自动驼峰转换：下划线 <=> 驼峰
    map-underscore-to-camel-case: true

ILoveApi:
  apikey: ${TPSApiKey}
  apiBaseUrl: https://api.xiaotuo.net/api/juhejx #更换成聚合api
#  apiBaseUrl: https://api.xiaotuo.net/api/douyin


# 文件上传
dromara:
  x-file-storage: #文件存储配置
    default-platform: aliyun-oss-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    #对应平台的配置写在这里，注意缩进要对齐
    aliyun-oss:
      - platform: aliyun-oss-1 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: ${OSS_ACCESS_KEY_ID}
        secret-key: ${OSS_ACCESS_KEY_SECRET}
        end-point: oss-cn-beijing.aliyuncs.com
        bucket-name: taiyidu
        domain: https://taiyidu.oss-cn-beijing.aliyuncs.com/ # 访问域名，注意“/”结尾，例如：https://abc.oss-cn-shanghai.aliyuncs.com/
        base-path: taiyidu-gongsheng-videos/ # 基础路径

gongsheng:
  jwt:
    admin-secret-key: taiyidu-gongsheng-jwt-secret-key-2026
    admin-ttl: 604800000
    admin-token-name: Authorization
